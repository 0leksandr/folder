name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not of the form vX.Y.Z" >&2
            exit 1
          fi
          echo "PLUGIN_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          ./gradlew test generateUpdatePluginsXml \
            -PpluginVersion="$PLUGIN_VERSION" \
            -PdownloadBaseUrl="${{ github.server_url }}/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/fold-to-defaults-${PLUGIN_VERSION}.zip" \
            build/distributions/updatePlugins.xml \
            --title "$GITHUB_REF_NAME" --generate-notes
